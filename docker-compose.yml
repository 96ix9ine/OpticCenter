version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: optics_clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    environment:
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=1234
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  backend:
    build: ./backend
    container_name: optics_backend
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=1234
    depends_on:
      - clickhouse

  frontend:
    build: ./frontend
    container_name: optics_frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  clickhouse_data: