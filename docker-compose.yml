version: '3.8'

services:
  # Бэкенд на Python (FastAPI + AI логика)
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - ENV=development

  # Фронтенд на React + TypeScript
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # Чтобы докер не затирал локальные пакеты ноды
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
